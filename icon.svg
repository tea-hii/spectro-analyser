<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Outer Squircle Gradient -->
    <linearGradient id="bg-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b111e" />
      <stop offset="45%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#181436" />
    </linearGradient>

    <!-- Top-left lighting highlight -->
    <radialGradient id="bg-glow" cx="20%" cy="15%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Center ambient radial flare -->
    <radialGradient id="center-flare" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Spectrogram Spectral Columns Gradient (Low to High Intensity) -->
    <linearGradient id="spec-heat-1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="spec-heat-2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="40%" stop-color="#06b6d4" />
      <stop offset="75%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <linearGradient id="spec-heat-3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="35%" stop-color="#8b5cf6" />
      <stop offset="70%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- MIDI Note Gradient -->
    <linearGradient id="midi-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <linearGradient id="midi-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="midi-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Waveform Sine Stroke Gradient -->
    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#4ade80" />
      <stop offset="70%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Playhead Gold Gradient -->
    <linearGradient id="playhead-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#facc15" />
      <stop offset="85%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0.3" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="blur1" />
      <feGaussianBlur stdDeviation="18" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Outer Shadow Container -->
  <g filter="url(#drop-shadow)">
    <!-- App Squircle Body -->
    <rect x="28" y="28" width="456" height="456" rx="108" fill="url(#bg-base)" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.35" />
    <!-- Ambient Inner Light -->
    <rect x="28" y="28" width="456" height="456" rx="108" fill="url(#bg-glow)" />
    <!-- Deep Glass Rim -->
    <rect x="36" y="36" width="440" height="440" rx="100" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.08" />
  </g>

  <!-- Central Flare -->
  <circle cx="256" cy="256" r="170" fill="url(#center-flare)" />

  <!-- Background Acoustic Coordinate Grid Lines -->
  <g stroke="#334155" stroke-width="1.5" stroke-dasharray="4,6" opacity="0.35">
    <line x1="72" y1="130" x2="440" y2="130" />
    <line x1="72" y1="190" x2="440" y2="190" />
    <line x1="72" y1="256" x2="440" y2="256" />
    <line x1="72" y1="322" x2="440" y2="322" />
    <line x1="72" y1="382" x2="440" y2="382" />
  </g>

  <!-- TIER 1: Spectrogram Formants / CQT Harmonic Spectral Bars -->
  <!-- Column 1 (x=96) -->
  <g opacity="0.82">
    <rect x="86" y="310" width="22" height="66" rx="6" fill="url(#spec-heat-1)" />
    <rect x="86" y="246" width="22" height="48" rx="6" fill="url(#spec-heat-1)" opacity="0.75" />
  </g>

  <!-- Column 2 (x=136) -->
  <g opacity="0.88">
    <rect x="125" y="292" width="24" height="84" rx="7" fill="url(#spec-heat-1)" />
    <rect x="125" y="214" width="24" height="62" rx="7" fill="url(#spec-heat-2)" />
    <rect x="125" y="152" width="24" height="46" rx="7" fill="url(#spec-heat-2)" filter="url(#soft-glow)" />
  </g>

  <!-- Column 3 (x=176) -->
  <g opacity="0.92">
    <rect x="164" y="280" width="26" height="96" rx="7" fill="url(#spec-heat-1)" />
    <rect x="164" y="196" width="26" height="68" rx="7" fill="url(#spec-heat-2)" />
    <rect x="164" y="126" width="26" height="54" rx="7" fill="url(#spec-heat-3)" filter="url(#soft-glow)" />
  </g>

  <!-- Column 4 (x=218) -->
  <g opacity="0.95">
    <rect x="205" y="296" width="26" height="80" rx="7" fill="url(#spec-heat-1)" />
    <rect x="205" y="224" width="26" height="56" rx="7" fill="url(#spec-heat-2)" />
    <rect x="205" y="162" width="26" height="46" rx="7" fill="url(#spec-heat-2)" />
    <rect x="205" y="104" width="26" height="42" rx="7" fill="url(#spec-heat-3)" filter="url(#soft-glow)" />
  </g>

  <!-- Column 5 (x=256 - Center Harmonic Peak) -->
  <g opacity="1">
    <rect x="243" y="270" width="26" height="106" rx="7" fill="url(#spec-heat-1)" />
    <rect x="243" y="186" width="26" height="68" rx="7" fill="url(#spec-heat-2)" />
    <rect x="243" y="112" width="26" height="58" rx="7" fill="url(#spec-heat-3)" filter="url(#neon-glow)" />
  </g>

  <!-- Column 6 (x=294) -->
  <g opacity="0.95">
    <rect x="281" y="286" width="26" height="90" rx="7" fill="url(#spec-heat-1)" />
    <rect x="281" y="206" width="26" height="64" rx="7" fill="url(#spec-heat-2)" />
    <rect x="281" y="142" width="26" height="48" rx="7" fill="url(#spec-heat-2)" />
  </g>

  <!-- Column 7 (x=334) -->
  <g opacity="0.92">
    <rect x="322" y="278" width="26" height="98" rx="7" fill="url(#spec-heat-1)" />
    <rect x="322" y="192" width="26" height="70" rx="7" fill="url(#spec-heat-2)" />
    <rect x="322" y="120" width="26" height="56" rx="7" fill="url(#spec-heat-3)" filter="url(#soft-glow)" />
  </g>

  <!-- Column 8 (x=374) -->
  <g opacity="0.88">
    <rect x="362" y="294" width="24" height="82" rx="7" fill="url(#spec-heat-1)" />
    <rect x="362" y="220" width="24" height="58" rx="7" fill="url(#spec-heat-2)" />
    <rect x="362" y="160" width="24" height="44" rx="7" fill="url(#spec-heat-2)" />
  </g>

  <!-- Column 9 (x=414) -->
  <g opacity="0.82">
    <rect x="404" y="316" width="22" height="60" rx="6" fill="url(#spec-heat-1)" />
    <rect x="404" y="254" width="22" height="46" rx="6" fill="url(#spec-heat-1)" opacity="0.75" />
  </g>

  <!-- TIER 2: MIDI Piano Roll Note Blocks (Horizontal Transcribed Notes) -->
  <g filter="url(#soft-glow)">
    <!-- Lower fundamental note -->
    <rect x="100" y="324" width="76" height="14" rx="5" fill="url(#midi-cyan)" opacity="0.95" stroke="#7dd3fc" stroke-width="1.5" />
    <!-- Third harmonic note -->
    <rect x="194" y="238" width="88" height="15" rx="5" fill="url(#midi-purple)" opacity="0.95" stroke="#d8b4fe" stroke-width="1.5" />
    <!-- Fifth / High melody note -->
    <rect x="244" y="146" width="102" height="16" rx="5" fill="url(#midi-gold)" opacity="0.98" stroke="#fef08a" stroke-width="1.8" filter="url(#neon-glow)" />
    <!-- Cadence note -->
    <rect x="336" y="208" width="78" height="15" rx="5" fill="url(#midi-cyan)" opacity="0.95" stroke="#7dd3fc" stroke-width="1.5" />
  </g>

  <!-- TIER 3: Continuous Speech & Musical Acoustic Waveform -->
  <path d="M 68 256 
           C 100 256, 116 172, 148 172
           C 180 172, 194 336, 226 336
           C 246 336, 252 88, 274 88
           C 294 88, 306 376, 332 376
           C 358 376, 372 208, 398 208
           C 424 208, 436 256, 444 256"
        fill="none"
        stroke="url(#wave-grad)"
        stroke-width="5"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#neon-glow)" />

  <path d="M 68 256 
           C 100 256, 116 172, 148 172
           C 180 172, 194 336, 226 336
           C 246 336, 252 88, 274 88
           C 294 88, 306 376, 332 376
           C 358 376, 372 208, 398 208
           C 424 208, 436 256, 444 256"
        fill="none"
        stroke="#ffffff"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.9" />

  <!-- TIER 4: Luminous Laser Playhead Cursor (Precision Audio Timeline) -->
  <g filter="url(#neon-glow)">
    <!-- Vertical Playhead Line -->
    <line x1="256" y1="72" x2="256" y2="420" stroke="url(#playhead-grad)" stroke-width="3.5" stroke-linecap="round" />
    
    <!-- Top Playhead Diamond Marker -->
    <polygon points="256,66 266,80 256,94 246,80" fill="#fef08a" stroke="#eab308" stroke-width="2" />
    
    <!-- Center Audio Scrub Node -->
    <circle cx="256" cy="256" r="6.5" fill="#facc15" stroke="#ffffff" stroke-width="2.5" />
    
    <!-- Bottom Anchor Tip -->
    <circle cx="256" cy="418" r="3.5" fill="#facc15" />
  </g>

  <!-- Ambient Micro Particles (Floating Harmonic Resonance) -->
  <circle cx="156" cy="116" r="2.5" fill="#38bdf8" opacity="0.8" />
  <circle cx="360" cy="112" r="3" fill="#ec4899" opacity="0.8" />
  <circle cx="114" cy="276" r="2" fill="#4ade80" opacity="0.7" />
  <circle cx="396" cy="290" r="2.5" fill="#fbbf24" opacity="0.75" />
  <circle cx="304" cy="98" r="2" fill="#c084fc" opacity="0.7" />
</svg>
