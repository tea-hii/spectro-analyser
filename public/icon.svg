<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="spec" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="35%" stop-color="#06b6d4" />
      <stop offset="70%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="sub" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#bg)" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.3" />

  <!-- Grid lines -->
  <line x1="64" y1="160" x2="448" y2="160" stroke="#334155" stroke-width="2" stroke-dasharray="6,6" opacity="0.6"/>
  <line x1="64" y1="240" x2="448" y2="240" stroke="#334155" stroke-width="2" stroke-dasharray="6,6" opacity="0.6"/>
  <line x1="64" y1="320" x2="448" y2="320" stroke="#334155" stroke-width="2" stroke-dasharray="6,6" opacity="0.6"/>

  <!-- Spectrogram Formants Heat bars -->
  <g opacity="0.85">
    <rect x="80" y="260" width="36" height="50" rx="6" fill="#0284c7" />
    <rect x="80" y="200" width="36" height="40" rx="6" fill="#06b6d4" />
    <rect x="80" y="140" width="36" height="30" rx="6" fill="#eab308" />

    <rect x="130" y="240" width="40" height="70" rx="6" fill="#0284c7" />
    <rect x="130" y="180" width="40" height="45" rx="6" fill="#06b6d4" />
    <rect x="130" y="120" width="40" height="35" rx="6" fill="#ef4444" filter="url(#glow)"/>

    <rect x="185" y="270" width="36" height="40" rx="6" fill="#0284c7" />
    <rect x="185" y="210" width="36" height="35" rx="6" fill="#06b6d4" />

    <rect x="235" y="230" width="42" height="80" rx="6" fill="#0284c7" />
    <rect x="235" y="160" width="42" height="50" rx="6" fill="#eab308" />
    <rect x="235" y="100" width="42" height="35" rx="6" fill="#ef4444" filter="url(#glow)"/>

    <rect x="290" y="250" width="38" height="60" rx="6" fill="#0284c7" />
    <rect x="290" y="190" width="38" height="45" rx="6" fill="#06b6d4" />

    <rect x="340" y="240" width="42" height="70" rx="6" fill="#0284c7" />
    <rect x="340" y="170" width="42" height="55" rx="6" fill="#eab308" />
    <rect x="340" y="110" width="42" height="35" rx="6" fill="#ef4444" filter="url(#glow)"/>

    <rect x="395" y="260" width="36" height="50" rx="6" fill="#0284c7" />
    <rect x="395" y="210" width="36" height="30" rx="6" fill="#06b6d4" />
  </g>

  <!-- Yellow playhead cursor line -->
  <line x1="256" y1="80" x2="256" y2="400" stroke="#facc15" stroke-width="4" filter="url(#glow)" />
  <polygon points="246,80 266,80 256,96" fill="#facc15" />

  <!-- Subtitle badge block at bottom -->
  <rect x="70" y="340" width="372" height="64" rx="14" fill="#1e293b" stroke="#475569" stroke-width="2" />
  <text x="96" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#f8fafc">
    [sɛ.tyn] <tspan fill="#38bdf8">C'est une</tspan> <tspan fill="#facc15">histoire</tspan>
  </text>
  <circle cx="414" cy="372" r="12" fill="#a855f7" />
  <text x="414" y="377" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="bold" fill="#ffffff">k</text>
</svg>
